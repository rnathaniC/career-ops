# config/sources.yml — declarative scan sources (Kaizen K-2026-06-08-2, approved 2026-06-11)
# Single source of truth for company slugs. The scheduled task + scan.mjs + Worker read THIS,
# not SKILL.md. ats types: greenhouse | lever | ashby | workday
defaults:
  target_titles:
    - Product Manager
    - Program Manager
    - Technical Program Manager
    - Scrum Master
    - Agile Coach
    - Project Manager
  target_locations: [Dallas, Remote, United States]
  salary_floor_usd: 110000

greenhouse:   # GET https://boards-api.greenhouse.io/v1/boards/{slug}/jobs  (keyless, free)
  - { slug: stripe,     verified: 2026-06-08, last_count: 482 }
  - { slug: anthropic,  verified: 2026-06-08, last_count: 371 }
  - { slug: databricks, verified: 2026-06-08, last_count: 761 }
  - { slug: figma,      verified: 2026-06-08, last_count: 167 }

ashby:        # GET https://api.ashbyhq.com/posting-api/job-board/{slug}  (keyless, free)
  # Root cause of "Lever all returned 0" (REFRESH_2026-06-08): these companies are on Ashby.
  - { slug: notion, verified: 2026-06-11 }   # live payload confirmed 2026-06-11
  - { slug: linear, verified: 2026-06-12 }   # API-verified: 25 jobs live, 0 title matches today

lever: []     # Re-add ONLY API-verified slugs. Prior 5 all returned 0 — wrong ATS, not typos.

workday:      # Phase 2 (Rahil priority #2) — listener for select target companies.
  enabled: false
  # CXS endpoint shape: POST https://{tenant}.{wd}.myworkdayjobs.com/wday/cxs/{tenant}/{site}/jobs
  sites: []   # e.g. { tenant: anthem, wd: wd1, site: External }
